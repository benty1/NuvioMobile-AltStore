name: Update AltStore Repo ASAP

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
si      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run dynamic update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_repo.py

      - name: Commit and push if repo.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update repo.json with latest releases [skip ci]" && git push)
