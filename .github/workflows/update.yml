name: Update AltStore Repo

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      manual_variant:
        description: 'Choose specific target to update'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - enhanced-yesnt10
          - enhanced-luqmanfadlli
          - scenebox

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run dynamic update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_VARIANT: ${{ github.event.inputs.manual_variant }}
        run: python update_repo.py

      - name: Commit and push if repo.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update repo.json with latest releases [skip ci]" && git push)
