name: Update Nuvio Repository

on:
  repository_dispatch:
    types: [nuvio_release_update]
  workflow_dispatch:
    inputs:
      variant:
        description: 'App variant to check/update'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - official
          - enhanced

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Sync Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_VARIANT: ${{ github.event.client_payload.variant }}
          MANUAL_VARIANT: ${{ inputs.variant }}
        run: python3 update_repo.py

      - name: Commit and push if modified
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Sync Nuvio and Enhanced repo versions" && git push)
